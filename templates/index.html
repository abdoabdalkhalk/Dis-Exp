<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord File Uploader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #5865F2;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #5865F2;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #5865F2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        
        button:hover {
            background: #4752c4;
        }
        
        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        
        .success {
            background: #c6f6d5;
            color: #2f855a;
            border: 1px solid #9ae6b4;
        }
        
        .error {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #fc8181;
        }
        
        .info {
            background: #bee3f8;
            color: #2c5282;
            border: 1px solid #90cdf4;
            font-size: 13px;
            margin-bottom: 20px;
            padding: 10px;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #5865F2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 رفع ملفات Discord</h1>
        
        <div class="info">
            💡 هذه الخدمة تقوم بتحميل الملف من الرابط المباشر ورفعه إلى قناة Discord باستخدام حسابك<br>
            ⚠️ استخدم توكن حسابك الشخصي (User Token) - احذر من مشاركته مع أحد
        </div>
        
        <form id="uploadForm">
            <div class="form-group">
                <label for="token">🔑 توكن الحساب (User Token):</label>
                <input type="password" id="token" name="token" required 
                       placeholder="ضع توكن حسابك هنا (ليس توكن البوت)">
            </div>
            
            <div class="form-group">
                <label for="channel_id">📺 معرف القناة (Channel ID):</label>
                <input type="text" id="channel_id" name="channel_id" required 
                       placeholder="مثال: 123456789012345678">
            </div>
            
            <div class="form-group">
                <label for="file_url">🔗 رابط الملف المباشر:</label>
                <input type="url" id="file_url" name="file_url" required 
                       placeholder="https://example.com/file.zip">
            </div>
            
            <button type="submit" id="submitBtn">رفع الملف</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #4a5568;">جاري الرفع...</p>
            </div>
            
            <div class="message" id="message"></div>
        </form>
    </div>
    
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const message = document.getElementById('message');
            
            // إخفاء الرسائل السابقة
            message.style.display = 'none';
            
            // تعطيل الزر وإظهار Loading
            submitBtn.disabled = true;
            loading.style.display = 'block';
            
            const data = {
                token: document.getElementById('token').value,
                channel_id: document.getElementById('channel_id').value,
                file_url: document.getElementById('file_url').value
            };
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                loading.style.display = 'none';
                message.style.display = 'block';
                
                if (result.success) {
                    message.className = 'message success';
                    message.textContent = '✅ ' + result.message;
                } else {
                    message.className = 'message error';
                    message.textContent = '❌ ' + result.message;
                }
                
            } catch (error) {
                loading.style.display = 'none';
                message.style.display = 'block';
                message.className = 'message error';
                message.textContent = '❌ حدث خطأ في الاتصال: ' + error.message;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
