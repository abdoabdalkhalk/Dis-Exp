<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord File Uploader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #5865F2;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group { margin-bottom: 20px; }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 600;
        }
        
        .label-optional {
            color: #a0aec0;
            font-weight: 400;
            font-size: 13px;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #5865F2;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #5865F2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        button:hover { 
            background: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.4);
        }
        
        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .success {
            background: #c6f6d5;
            color: #2f855a;
            border: 2px solid #9ae6b4;
        }
        
        .info {
            background: #bee3f8;
            color: #2c5282;
            border: 2px solid #90cdf4;
        }
        
        .warning {
            background: #feebc8;
            color: #c05621;
            border: 2px solid #fbd38d;
        }
        
        .alert-box {
            background: #e6fffa;
            border: 2px solid #81e6d9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #234e52;
        }
        
        .alert-box strong {
            display: block;
            margin-bottom: 8px;
            color: #1a365d;
            font-size: 15px;
        }
        
        .hint {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }
        
        .job-id {
            background: #f7fafc;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 14px;
            color: #2d3748;
        }
        
        .live-status {
            background: #f0f4ff;
            border: 2px solid #a0c4ff;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            display: none;
        }
        
        .live-status.active {
            display: block;
        }
        
        .status-pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #48bb78;
            border-radius: 50%;
            margin-left: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .download-box {
            background: #d4edda;
            border: 2px solid #28a745;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }
        
        .download-box.active {
            display: block;
        }
        
        .download-btn {
            background: #28a745;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .download-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 رافع ملفات Discord</h1>
        
        <div class="alert-box">
            <strong>🚀 يعمل في الخلفية!</strong>
            بعد الضغط على "رفع الملف"، يمكنك:<br>
            ✅ إغلاق الصفحة<br>
            ✅ إغلاق المتصفح<br>
            ✅ إيقاف جهازك<br>
            <br>
            السيرفر سيكمل الرفع تلقائياً! 🎯
        </div>
        
        <form id="uploadForm">
            <div class="form-group">
                <label for="token">🔑 توكن الحساب (User Token):</label>
                <input type="password" id="token" required 
                       placeholder="ضع توكن حسابك هنا">
            </div>
            
            <div class="form-group">
                <label for="channel_id">📺 معرف القناة (Channel ID):</label>
                <input type="text" id="channel_id" required 
                       placeholder="123456789012345678">
            </div>
            
            <div class="form-group">
                <label for="file_url">🔗 رابط الملف المباشر:</label>
                <input type="url" id="file_url" required 
                       placeholder="https://example.com/file.zip">
            </div>
            
            <div class="form-group">
                <label for="custom_filename">
                    ✏️ اسم مخصص للملف 
                    <span class="label-optional">(اختياري)</span>
                </label>
                <input type="text" id="custom_filename" 
                       placeholder="my-video (بدون امتداد)">
                <div class="hint">اتركه فارغاً للحفاظ على الاسم الأصلي</div>
            </div>
            
            <button type="submit" id="submitBtn">🚀 رفع الملف</button>
            
            <div class="message" id="message"></div>
            
            <div class="download-box" id="downloadBox">
                <strong>✅ الملف جاهز للتحميل من السيرفر!</strong>
                <br>
                <a href="#" id="downloadLink" class="download-btn" target="_blank">
                    ⬇️ تحميل الملف
                </a>
                <div style="margin-top: 10px; font-size: 13px; color: #155724;">
                    الآن سيتم رفعه تلقائياً للديسكورد...
                </div>
            </div>
            
            <div class="live-status" id="liveStatus">
                <strong>
                    <span class="status-pulse"></span>
                    حالة مباشرة:
                </strong>
                <div id="statusText" style="margin-top: 8px; font-size: 14px;"></div>
            </div>
        </form>
    </div>
    
    <script>
        let eventSource = null;
        let currentJobId = null;
        
        function startLiveTracking(jobId) {
            currentJobId = jobId;
            
            // إغلاق الاتصال السابق إن وجد
            if (eventSource) {
                eventSource.close();
            }
            
            // بدء اتصال keep-alive
            eventSource = new EventSource('/keep-alive');
            
            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    // عرض حالة الـ job الحالي
                    if (data.jobs && data.jobs[jobId]) {
                        const job = data.jobs[jobId];
                        document.getElementById('statusText').textContent = 
                            `${job.status === 'downloading' ? '⬇️' : job.status === 'uploading' ? '⬆️' : '📋'} ${job.progress}`;
                        document.getElementById('liveStatus').classList.add('active');
                        
                        // إذا أصبح الملف جاهز في temp
                        if (job.status === 'temp_ready' && job.download_url) {
                            const downloadBox = document.getElementById('downloadBox');
                            const downloadLink = document.getElementById('downloadLink');
                            downloadLink.href = job.download_url;
                            downloadBox.classList.add('active');
                        }
                        
                    } else if (data.active_jobs === 0) {
                        // انتهت العملية
                        document.getElementById('statusText').textContent = '✅ اكتملت العملية!';
                        setTimeout(() => {
                            document.getElementById('liveStatus').classList.remove('active');
                            if (eventSource) {
                                eventSource.close();
                                eventSource = null;
                            }
                        }, 3000);
                    }
                } catch (e) {
                    console.error('Error parsing event:', e);
                }
            };
            
            eventSource.onerror = (error) => {
                console.log('EventSource connection ended');
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                }
            };
        }
        
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const message = document.getElementById('message');
            
            // إخفاء الرسائل السابقة
            message.style.display = 'none';
            document.getElementById('liveStatus').classList.remove('active');
            document.getElementById('downloadBox').classList.remove('active');
            
            // تعطيل الزر مؤقتاً
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ جاري الإرسال...';
            
            const data = {
                token: document.getElementById('token').value,
                channel_id: document.getElementById('channel_id').value,
                file_url: document.getElementById('file_url').value,
                custom_filename: document.getElementById('custom_filename').value.trim()
            };
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    message.className = 'message success';
                    message.innerHTML = `
                        <strong>✅ ${result.message}</strong>
                        <div class="job-id">
                            Job ID: ${result.job_id}<br>
                            <small>احتفظ به للمتابعة لاحقاً</small>
                        </div>
                        <br>
                        <small>يمكنك الآن إغلاق هذه الصفحة - العملية تعمل في الخلفية! 🎉</small>
                    `;
                    message.style.display = 'block';
                    
                    // بدء التتبع المباشر
                    startLiveTracking(result.job_id);
                    
                    // مسح النموذج
                    document.getElementById('file_url').value = '';
                    document.getElementById('custom_filename').value = '';
                    
                } else {
                    throw new Error(result.message || 'فشل بدء العملية');
                }
                
            } catch (error) {
                message.className = 'message warning';
                message.innerHTML = `<strong>⚠️ خطأ:</strong> ${error.message}`;
                message.style.display = 'block';
            } finally {
                // إعادة تفعيل الزر
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 رفع الملف';
            }
        });
        
        // تنظيف عند إغلاق الصفحة
        window.addEventListener('beforeunload', () => {
            if (eventSource) {
                eventSource.close();
            }
        });
    </script>
</body>
</html>
