<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord File Uploader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #5865F2;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group { margin-bottom: 20px; }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 600;
        }
        
        .label-optional {
            color: #a0aec0;
            font-weight: 400;
            font-size: 13px;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #5865F2;
        }
        
        .file-info {
            margin-top: 8px;
            padding: 10px;
            background: #f7fafc;
            border-radius: 6px;
            font-size: 13px;
            color: #4a5568;
            display: none;
        }
        
        .file-info.show { display: block; }
        
        .file-info strong { color: #2d3748; }
        
        button {
            width: 100%;
            padding: 14px;
            background: #5865F2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        
        button:hover { background: #4752c4; }
        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        
        .success {
            background: #c6f6d5;
            color: #2f855a;
            border: 1px solid #9ae6b4;
        }
        
        .error {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #fc8181;
        }
        
        .info {
            background: #bee3f8;
            color: #2c5282;
            border: 1px solid #90cdf4;
            font-size: 13px;
            margin-bottom: 20px;
            padding: 10px;
            line-height: 1.6;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 10px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #5865F2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        .progress-text {
            margin-top: 15px;
            color: #2d3748;
            font-size: 15px;
            font-weight: 600;
        }
        
        .progress-detail {
            margin-top: 8px;
            color: #718096;
            font-size: 13px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .status-downloading {
            background: #bee3f8;
            color: #2c5282;
        }
        
        .status-uploading {
            background: #fbd38d;
            color: #7c2d12;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 رافع ملفات Discord</h1>
        
        <div class="info">
            ✅ يستخدم نت السيرفر (سريع)<br>
            ⚠️ لا تشارك توكن حسابك<br>
            ⏱️ الملفات الكبيرة (300MB+) تستغرق 5-15 دقيقة<br>
            💡 يمكنك إغلاق الصفحة والعودة - العملية تعمل في الخلفية
        </div>
        
        <form id="uploadForm">
            <div class="form-group">
                <label for="token">🔑 توكن الحساب (User Token):</label>
                <input type="password" id="token" required 
                       placeholder="ضع توكن حسابك هنا">
            </div>
            
            <div class="form-group">
                <label for="channel_id">📺 معرف القناة (Channel ID):</label>
                <input type="text" id="channel_id" required 
                       placeholder="123456789012345678">
            </div>
            
            <div class="form-group">
                <label for="file_url">🔗 رابط الملف المباشر:</label>
                <input type="url" id="file_url" required 
                       placeholder="https://example.com/file.zip">
                <div class="file-info" id="fileInfo">
                    <strong>الامتداد المكتشف:</strong> <span id="detectedExt">-</span><br>
                    <small>سيتم الحفاظ على هذا الامتداد تلقائياً</small>
                </div>
            </div>
            
            <div class="form-group">
                <label for="custom_filename">
                    ✏️ اسم مخصص للملف 
                    <span class="label-optional">(اختياري)</span>
                </label>
                <input type="text" id="custom_filename" 
                       placeholder="مثال: my-video (بدون امتداد)">
                <small style="color: #718096; font-size: 12px; margin-top: 5px; display: block;">
                    اتركه فارغاً للحفاظ على الاسم الأصلي
                </small>
            </div>
            
            <button type="submit" id="submitBtn">ابدأ الرفع</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p class="progress-text" id="statusText">جاري الإعداد...</p>
                <p class="progress-detail" id="progressText"></p>
                <span class="status-badge" id="statusBadge"></span>
            </div>
            
            <div class="message" id="message"></div>
        </form>
    </div>
    
    <script>
        let checkInterval = null;
        let currentJobId = null;
        let failedChecks = 0;
        const MAX_FAILED_CHECKS = 10; // زيادة الحد للسماح بمزيد من المحاولات
        
        // كشف الامتداد عند تغيير رابط الملف
        document.getElementById('file_url').addEventListener('input', function() {
            const url = this.value.trim();
            const fileInfo = document.getElementById('fileInfo');
            const detectedExt = document.getElementById('detectedExt');
            
            if (url) {
                const filename = url.split('/').pop().split('?')[0];
                if (filename.includes('.')) {
                    const ext = '.' + filename.split('.').pop();
                    detectedExt.textContent = ext;
                    fileInfo.classList.add('show');
                } else {
                    detectedExt.textContent = 'غير معروف';
                    fileInfo.classList.add('show');
                }
            } else {
                fileInfo.classList.remove('show');
            }
        });
        
        async function checkStatus(jobId) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000); // 8 ثواني timeout
                
                const response = await fetch(`/status/${jobId}`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const status = await response.json();
                
                // إعادة تعيين عداد الفشل عند النجاح
                failedChecks = 0;
                
                const statusText = document.getElementById('statusText');
                const progressText = document.getElementById('progressText');
                const statusBadge = document.getElementById('statusBadge');
                const loading = document.getElementById('loading');
                const message = document.getElementById('message');
                const submitBtn = document.getElementById('submitBtn');
                
                // تحديث التقدم
                if (status.progress) {
                    progressText.textContent = status.progress;
                }
                
                // تحديث الحالة
                if (status.status === 'queued') {
                    statusText.textContent = '⏳ في الانتظار...';
                    statusBadge.textContent = 'في الانتظار';
                    statusBadge.className = 'status-badge status-downloading';
                    
                } else if (status.status === 'downloading') {
                    statusText.textContent = '⬇️ جاري التحميل من الرابط...';
                    statusBadge.textContent = 'تحميل';
                    statusBadge.className = 'status-badge status-downloading';
                    
                } else if (status.status === 'uploading') {
                    statusText.textContent = '⬆️ جاري الرفع إلى Discord...';
                    statusBadge.textContent = 'رفع';
                    statusBadge.className = 'status-badge status-uploading';
                    
                } else if (status.status === 'completed') {
                    clearInterval(checkInterval);
                    loading.style.display = 'none';
                    message.style.display = 'block';
                    message.className = 'message success';
                    message.textContent = status.message || '✅ تم الرفع بنجاح!';
                    submitBtn.disabled = false;
                    document.getElementById('file_url').value = '';
                    document.getElementById('custom_filename').value = '';
                    document.getElementById('fileInfo').classList.remove('show');
                    currentJobId = null;
                    failedChecks = 0;
                    
                } else if (status.status === 'failed') {
                    clearInterval(checkInterval);
                    loading.style.display = 'none';
                    message.style.display = 'block';
                    message.className = 'message error';
                    message.textContent = '❌ ' + (status.message || 'فشلت العملية');
                    submitBtn.disabled = false;
                    currentJobId = null;
                    failedChecks = 0;
                }
                
            } catch (error) {
                console.error('خطأ في فحص الحالة:', error);
                failedChecks++;
                
                // إذا فشل الفحص أكثر من الحد المسموح
                if (failedChecks >= MAX_FAILED_CHECKS) {
                    clearInterval(checkInterval);
                    document.getElementById('loading').style.display = 'none';
                    const message = document.getElementById('message');
                    message.style.display = 'block';
                    message.className = 'message error';
                    message.textContent = '❌ فقد الاتصال بالسيرفر. العملية قد تكون مستمرة في الخلفية.';
                    document.getElementById('submitBtn').disabled = false;
                    failedChecks = 0;
                }
                
                // إذا كانت المشكلة timeout، نحاول مرة أخرى بهدوء
                if (error.name === 'AbortError') {
                    console.log('Timeout - سنحاول مرة أخرى...');
                }
            }
        }
        
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const message = document.getElementById('message');
            
            // إخفاء الرسائل السابقة
            message.style.display = 'none';
            failedChecks = 0;
            
            // تعطيل الزر وإظهار Loading
            submitBtn.disabled = true;
            loading.style.display = 'block';
            
            const data = {
                token: document.getElementById('token').value,
                channel_id: document.getElementById('channel_id').value,
                file_url: document.getElementById('file_url').value,
                custom_filename: document.getElementById('custom_filename').value.trim()
            };
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000); // 15 ثانية
                
                // طلب بدء العملية
                const response = await fetch('/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.success && result.job_id) {
                    currentJobId = result.job_id;
                    console.log('Job started:', result.job_id);
                    
                    // بدء متابعة الحالة كل 3 ثواني (زيادة الفترة لتقليل الضغط)
                    checkInterval = setInterval(() => {
                        checkStatus(result.job_id);
                    }, 3000);
                    
                    // فحص فوري
                    setTimeout(() => checkStatus(result.job_id), 500);
                    
                } else {
                    throw new Error(result.message || 'فشل بدء العملية');
                }
                
            } catch (error) {
                loading.style.display = 'none';
                message.style.display = 'block';
                message.className = 'message error';
                
                if (error.name === 'AbortError') {
                    message.textContent = '❌ السيرفر لم يرد خلال 15 ثانية - حاول مرة أخرى';
                } else {
                    message.textContent = '❌ خطأ: ' + error.message;
                }
                
                submitBtn.disabled = false;
                failedChecks = 0;
            }
        });
        
        // إيقاف التحديث عند إغلاق الصفحة
        window.addEventListener('beforeunload', () => {
            if (checkInterval) {
                clearInterval(checkInterval);
            }
        });
    </script>
</body>
</html>
